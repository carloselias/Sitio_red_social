<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi perfil</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

    <header class="blog-header">

        <div class="header-container">

            <a href="#" class="blog-logo">
                <img src="/svg/logo.svg" alt="" aria-hidden="true">
                <span class="blog-logo-text">HTT Social</span>
            </a>

            <nav class="main-navigation">
                <a href="#" class="nav-link">Inicio</a>
                <a href="#" class="nav-link">Mis publicaciones</a>
                <a href="#" class="nav-link-create-post">Crear publicación</a>
            </nav>

            <div class="user-section">

                <img src="/svg/default-user-icon.svg" class="user-icon">

                <span class="user-name">
                    Invitado
                </span>

                <a href="registroUser.html" id="register-button" class="register-button">
                    Registrarse
                </a>

                <button
                    id="login-button"
                    class="login-button"
                >
                    Iniciar sesión
                </button>

                <button
                    id="logout-button"
                    class="logout-button"
                    style="display: none;"
                >
                    Cerrar sesión
                </button>

            </div>


        </div>

    </header>


<main class="blog-main">

    <section class="profile-section">

        <div class="section-header">

            <h1 class="section-title">
                Mi perfil
            </h1>

        </div>

        <form
            id="profile-form"
            class="post-form"
        >


            <!-- Foto de perfil -->

            <div class="form-group">

                <label class="form-label">
                    Foto de perfil
                </label>


                <div
                    id="profile-image-container"
                    class="profile-image-container"
                >

                    <p id="no-profile-image">
                        No tienes una foto de perfil.
                    </p>

                </div>


                <input
                    type="file"
                    id="profile-image"
                    class="form-input"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                >


                <small class="form-help">
                    JPG, PNG, WEBP o GIF. Máximo 5 MB.
                </small>

            </div>


            <!-- Nombre -->

            <div class="form-group">

                <label
                    id = "header-user-name"
                    for="profile-name"
                    class="form-label"
                >
                    Nombre
                </label>


                <input
                    type="text"
                    id="profile-name"
                    class="form-input"
                    maxlength="100"
                    required
                >

            </div>

            <!-- Usuarios -->
            <div
                id="followers-info"
                class="followers-info"
            >
                <span id="followers-count">
                    0
                </span>
                seguidores
            </div>

            <div
                id="follow-section"
                class="follow-section"
                style="display: none;"
            >

                <button
                    id="follow-button"
                    class="follow-button"
                    type="button"
                >
                    Seguir
                </button>
            </div>

            <!-- Correo -->

            <div class="form-group">

                <label
                    for="profile-email"
                    class="form-label"
                >
                    Correo electrónico
                </label>


                <input
                    type="email"
                    id="profile-email"
                    class="form-input"
                    disabled
                >


                <small class="form-help">
                    El correo electrónico no puede modificarse desde esta pantalla.
                </small>

            </div>


            <!-- Descripción -->

            <div class="form-group">

                <label
                    for="profile-description"
                    class="form-label"
                >
                    Descripción
                </label>


                <textarea
                    id="profile-description"
                    class="form-textarea"
                    rows="5"
                    maxlength="500"
                    placeholder="Cuéntanos algo sobre ti..."
                ></textarea>


                <small class="form-help">
                    Máximo 500 caracteres.
                </small>

            </div>


            <div class="form-actions">

                <a
                    href="index.html"
                    class="cancel-button"
                >
                    Cancelar
                </a>


                <button
                    type="submit"
                    id="save-profile-button"
                    class="save-post-button"
                >
                    Guardar cambios
                </button>

            </div>


            <p
                id="profile-message"
                class="form-message"
            ></p>


        </form>

    </section>

</main>


<footer class="blog-footer">

    <p>
        HTT Social. Red Social educativa.
    </p>

</footer>


<script src="perfilUser.js"></script>

</body>

</html>
